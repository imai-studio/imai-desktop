name: Publish releases

# The IMAI source repository uploads each desktop release to
# downloads.imai.studio and writes desktop/<channel>/release.json. This
# workflow mirrors any release that isn't here yet as a GitHub release, after
# checking every file's size and SHA-256 against that manifest.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Mirror new releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs
